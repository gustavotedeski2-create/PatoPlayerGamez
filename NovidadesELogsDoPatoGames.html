<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Site De Jogos - Automático</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: #e0e0e0; padding: 20px; }
        .post { background: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #ff4500; }
        h2 { color: #ff4500; margin-top: 0; text-transform: capitalize; }
    </style>
</head>
<body>
    <h1>🕹️ Blog Automático de Jogos</h1>
    <div id="blog-posts">Sincronizando com o GitHub...</div>

    <script>
        // CONFIGURAÇÃO: Coloque seu usuário e o nome do seu repositório aqui
        const USUARIO = 'gustavotedeski2-create';
        const REPO = 'PatoPlayerGamez';

        async function carregarBlogAutomatico() {
            const container = document.getElementById('blog-posts');
            const urlAPI = `https://api.github.com/repos/${USUARIO}/${REPO}/contents/posts`;

            try {
                // 1. Pergunta para a API do GitHub o que tem na pasta 'posts'
                const response = await fetch(urlAPI);
                const arquivos = await response.json();
                
                container.innerHTML = '';

                // 2. Filtra apenas arquivos .txt e inverte para os novos virem primeiro
                const postsTxt = arquivos.filter(f => f.name.endsWith('.txt')).reverse();

                for (const arquivo of postsTxt) {
                    // 3. Busca o conteúdo real do arquivo
                    const conteudoRes = await fetch(arquivo.download_url);
                    const texto = await conteudoRes.text();

                    const postElement = document.createElement('article');
                    postElement.className = 'post';
                    postElement.innerHTML = `
                        <h2>${arquivo.name.replace('.txt', '').replace(/-/g, ' ')}</h2>
                        <div>${texto}</div>
                    `;
                    container.appendChild(postElement);
                }
            } catch (erro) {
                container.innerHTML = '<p>Erro ao ler a pasta de posts automática.</p>';
            }
        }

        carregarBlogAutomatico();
    </script>
</body>
</html>
